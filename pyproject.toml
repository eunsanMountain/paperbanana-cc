[project]
name = "paperbanana-cc"
version = "0.1.1"
description = "Claude Code Skill for publication-quality academic diagrams and plots — built on the PaperBanana framework (arXiv:2601.23265)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "eunsan.jo" },
]
keywords = ["claude-code", "academic", "diagram", "plot", "illustration", "paperbanana"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "openai>=1.40",
    "matplotlib>=3.9",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "json-repair>=0.30",

    "tqdm>=4.66",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "aiofiles>=23.0",
    "google-genai>=1.65",
]

[project.urls]
Homepage = "https://github.com/eunsanMountain/paperbanana-cc"
Paper = "https://arxiv.org/abs/2601.23265"
"Original (Research)" = "https://github.com/dwzhu-pku/PaperBanana"
"Original (Production)" = "https://github.com/llmsresearch/paperbanana"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
paperbanana-cc = "paperbanana_cc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
allow-insecure-host = [
    "download.pytorch.org",
    "download-r2.pytorch.org",
    "pypi.org",
    "files.pythonhosted.org",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
